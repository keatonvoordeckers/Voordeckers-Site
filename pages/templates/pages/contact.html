{% extends "base.html" %}

{% block title %}Contact | Eric Voordeckers{% endblock %}

{% block content %}
    <div class="contact">
        <h1>Get in touch</h1>
        <p class="lead">Tell us about your project and we'll get back to you.</p>

        <form method="post" class="contact-form" novalidate>
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <div class="field{% if field.name == 'website' %} hp{% endif %}">
                    {{ field.as_field_group }}
                </div>
            {% endfor %}
            <button type="submit" class="button">Send message</button>
        </form>
    </div>
{% endblock %}
