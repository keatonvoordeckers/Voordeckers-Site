{% load static %}
<!doctype html>
<html lang="en">
<!-- Header: -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Eric Voordeckers | Finish Carpentry{% endblock %}</title>
    <meta name="description" content="{% block description %}Custom finish carpentry by Eric Voordeckers: stair rails, ceilings, wall 
    treatments, fireplace mantels, mud benches & window seats, columns, cabinets & bookshelves, and bunk beds.{% endblock %}">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<!-- Body: -->
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'home' %}" class="brand">
                <span class="brand-name">Eric Voordeckers</span>
                <span class="brand-tagline">Finish Carpentry</span>
            </a>
            <nav class="site-nav" aria-label="Main">
                <a href="{% url 'home' %}" {% if request.resolver_match.url_name == "home" %}aria-current="page"{% endif %}>Home</a>
                <a href="{% url 'about' %}" {% if request.resolver_match.url_name == "about" %}aria-current="page"{% endif %}>About</a>
                <a href="{% url 'contact' %}" {% if request.resolver_match.url_name == "contact" %}aria-current="page"{% endif %}>Contact</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {% now "Y" %} Eric Voordeckers · Finish Carpentry</p>
        </div>
    </footer>
</body>
</html>
